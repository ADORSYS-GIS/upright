# Base hostname for the admin and site hosts:
#   app.<hostname> and <siteSubdomain>.<hostname>
hostname: upright.eudi-adorsys.com
siteSubdomain: fra

aws:
  region: eu-central-1
  secretsManagerKey: datev-wallet-secrets

secretStore:
  enabled: true
  name: upright-secret-store
  targetSecretName: upright-secret

externalSecret:
  enabled: true
  refreshInterval: 30m

prometheusRule:
  enabled: true

# Shared monitoring services in the monitoring namespace.
prometheusUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
alertmanagerUrl: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093

app-template:
  global:
    fullnameOverride: upright
    labels:
      app: upright

  defaultPodOptions:
    imagePullSecrets:
      - name: ghcr-pull-secret
    securityContext:
      fsGroup: 1000

  controllers:
    main:
      enabled: true
      type: deployment
      replicas: 1
      strategy: Recreate
      applyDefaultContainerOptionsToInitContainers: true
      defaultContainerOptionsStrategy: merge
      defaultContainerOptions:
        image:
          repository: ghcr.io/adorsys-gis/upright/upright
          tag: sha-3774812f19b3e49467a7821a1e261e67c9189622
          digest: sha256:95425981d98e67e1056fd810522cf3429afb21c9aa5cd97756bee8b252b68530
          pullPolicy: IfNotPresent
        env:
          UPRIGHT_HOSTNAME: upright.eudi-adorsys.com
          SITE_SUBDOMAIN: fra
          PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          ALERTMANAGER_URL: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
        envFrom:
          - secretRef:
              name: upright-secret
      initContainers:
        db-prepare:
          command:
            - ./bin/rails
            - db:prepare
      containers:
        web:
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9394
          probes:
            startup:
              enabled: true
              type: HTTP
              path: /up
              port: http
              spec:
                periodSeconds: 5
                failureThreshold: 30
            liveness:
              enabled: true
              type: HTTP
              path: /up
              port: http
              spec:
                periodSeconds: 30
            readiness:
              enabled: true
              type: HTTP
              path: /up
              port: http
              spec:
                periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
        jobs:
          dependsOn: web
          command:
            - ./bin/jobs
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi

  service:
    main:
      enabled: true
      controller: main
      primary: true
      type: ClusterIP
      ports:
        http:
          enabled: true
          primary: true
          port: 3000
          protocol: HTTP
          targetPort: 3000
        metrics:
          enabled: true
          port: 9394
          protocol: HTTP
          targetPort: 9394

  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/hostname: app.upright.eudi-adorsys.com,fra.upright.eudi-adorsys.com
      hosts:
        - host: app.upright.eudi-adorsys.com
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
        - host: fra.upright.eudi-adorsys.com
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: upright-eudi-adorsys-tls
          hosts:
            - app.upright.eudi-adorsys.com
            - fra.upright.eudi-adorsys.com

  persistence:
    storage:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 10Gi
      storageClass: high-performance
      retain: true
      globalMounts:
        - path: /rails/storage
    http-probes:
      enabled: true
      type: configMap
      identifier: http-probes
      globalMounts:
        - path: /rails/probes/http_probes.yml
          subPath: http_probes.yml
          readOnly: true
    smtp-probes:
      enabled: true
      type: configMap
      identifier: smtp-probes
      globalMounts:
        - path: /rails/probes/smtp_probes.yml
          subPath: smtp_probes.yml
          readOnly: true
    traceroute-probes:
      enabled: true
      type: configMap
      identifier: traceroute-probes
      globalMounts:
        - path: /rails/probes/traceroute_probes.yml
          subPath: traceroute_probes.yml
          readOnly: true

  configMaps:
    http-probes:
      enabled: true
      includeInChecksum: true
      includeChecksumInControllers:
        - main
      data:
        http_probes.yml: |
          # HTTP Probe Definitions
          # Add your HTTP health check probes here
          #
          # Required fields:
          #   - name: Unique identifier for the probe
          #   - url: The URL to check
          #
          # Optional fields:
          #   - expected_status: HTTP status code to expect (default: 200-399)
          #   - alert_severity: Alert severity when probe fails: medium, high (default), critical
          #   - basic_auth_credentials: Key in Rails credentials for basic auth
          #   - proxy: Key in Rails credentials for proxy settings

          # Add a real target before enabling. An active probe is checked every 30 seconds
          # and a failure is sent to the shared Alertmanager receiver.
          # - name: Example Health Check
          #   url: https://example.com

    smtp-probes:
      enabled: true
      includeInChecksum: true
      includeChecksumInControllers:
        - main
      data:
        smtp_probes.yml: |
          # SMTP Probe Definitions
          # Add your SMTP health check probes here
          #
          # Required fields:
          #   - name: Unique identifier for the probe
          #   - host: SMTP server hostname
          #
          # Optional fields:
          #   - alert_severity: Alert severity when probe fails: medium, high (default), critical

          # - name: Example Mail Server
          #   host: mail.example.com

    traceroute-probes:
      enabled: true
      includeInChecksum: true
      includeChecksumInControllers:
        - main
      data:
        traceroute_probes.yml: |
          # Traceroute Probe Definitions
          # Add your traceroute probes here
          #
          # Required fields:
          #   - name: Unique identifier for the probe
          #   - host: Hostname or IP address to trace
          #
          # Optional fields:
          #   - alert_severity: Alert severity when probe fails: medium, high (default), critical

          # - name: Example Service
          #   host: example.com


  serviceMonitor:
    main:
      enabled: true
      labels:
        release: kube-prometheus-stack
      service:
        identifier: main
      endpoints:
        - port: metrics
          interval: 15s
          path: /metrics
