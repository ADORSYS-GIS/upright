# Shared with the app-template subchart via Helm's global merge.
# Admin host is app.<hostname>; site host is <siteSubdomain>.<hostname>.
global:
  hostname: upright.eudi-adorsys.com
  siteSubdomain: fra
  secretStore:
    targetSecretName: upright-secret

aws:
  region: eu-central-1
  secretsManagerKey: datev-wallet-secrets

secretStore:
  enabled: true
  name: upright-secret-store

externalSecret:
  enabled: true
  refreshInterval: 30m

prometheusRule:
  enabled: true

app-template:
  global:
    fullnameOverride: upright
    labels:
      app: upright

  defaultPodOptions:
    imagePullSecrets:
      - name: ghcr-pull-secret
    securityContext:
      fsGroup: 1000

  controllers:
    main:
      enabled: true
      type: deployment
      replicas: 1
      strategy: Recreate
      applyDefaultContainerOptionsToInitContainers: true
      defaultContainerOptionsStrategy: merge
      defaultContainerOptions:
        image:
          repository: ghcr.io/adorsys-gis/upright/upright
          tag: sha-450596ef375689a1a715df07259e05bc5bf0f07e
          digest: sha256:187067ca755eca54f0bda9e49cdba9aa550ec29a1d736801c5ebc44f19a70b51
          pullPolicy: IfNotPresent
        env:
          UPRIGHT_HOSTNAME: "{{ .Values.global.hostname }}"
          SITE_SUBDOMAIN: "{{ .Values.global.siteSubdomain }}"
          PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          ALERTMANAGER_URL: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
        envFrom:
          - secretRef:
              name: "{{ .Values.global.secretStore.targetSecretName }}"
      initContainers:
        db-prepare:
          command:
            - ./bin/rails
            - db:prepare
      containers:
        web:
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9394
          probes:
            startup:
              enabled: true
              type: HTTP
              path: /up
              port: http
              spec:
                periodSeconds: 5
                failureThreshold: 30
            liveness:
              enabled: true
              type: HTTP
              path: /up
              port: http
              spec:
                periodSeconds: 30
            readiness:
              enabled: true
              type: HTTP
              path: /up
              port: http
              spec:
                periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
        jobs:
          command:
            - ./bin/jobs
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi

  service:
    main:
      enabled: true
      controller: main
      primary: true
      type: ClusterIP
      ports:
        http:
          enabled: true
          primary: true
          port: 3000
          protocol: HTTP
          targetPort: 3000
        metrics:
          enabled: true
          port: 9394
          protocol: HTTP
          targetPort: 9394

  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/hostname: "app.{{ .Values.global.hostname }},{{ .Values.global.siteSubdomain }}.{{ .Values.global.hostname }}"
      hosts:
        - host: "app.{{ .Values.global.hostname }}"
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
        - host: "{{ .Values.global.siteSubdomain }}.{{ .Values.global.hostname }}"
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: upright-eudi-adorsys-tls
          hosts:
            - "app.{{ .Values.global.hostname }}"
            - "{{ .Values.global.siteSubdomain }}.{{ .Values.global.hostname }}"

  persistence:
    storage:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 10Gi
      storageClass: high-performance
      retain: true
      globalMounts:
        - path: /rails/storage
    http-probes:
      enabled: true
      type: configMap
      identifier: http-probes
      globalMounts:
        - path: /rails/probes/http_probes.yml
          subPath: http_probes.yml
          readOnly: true
    smtp-probes:
      enabled: true
      type: configMap
      identifier: smtp-probes
      globalMounts:
        - path: /rails/probes/smtp_probes.yml
          subPath: smtp_probes.yml
          readOnly: true
    traceroute-probes:
      enabled: true
      type: configMap
      identifier: traceroute-probes
      globalMounts:
        - path: /rails/probes/traceroute_probes.yml
          subPath: traceroute_probes.yml
          readOnly: true

  configMaps:
    http-probes:
      enabled: true
      includeInChecksum: true
      includeChecksumInControllers:
        - main
      data:
        http_probes.yml: ""
    smtp-probes:
      enabled: true
      includeInChecksum: true
      includeChecksumInControllers:
        - main
      data:
        smtp_probes.yml: ""
    traceroute-probes:
      enabled: true
      includeInChecksum: true
      includeChecksumInControllers:
        - main
      data:
        traceroute_probes.yml: ""

  serviceMonitor:
    main:
      enabled: true
      labels:
        release: kube-prometheus-stack
      service:
        identifier: main
      endpoints:
        - port: metrics
          interval: 15s
          path: /metrics
