prometheusRule:
  # Keep this list aligned with HTTP probe names below and scheduled
  # Playwright probe names in config/recurring.yml.
  configuredProbeTargets:
    - type: http
      name: EUDI Wallet
    - type: http
      name: nginx proxy
    - type: http
      name: Verifier POS demo
    - type: http
      name: OID4VC Keycloak
    - type: http
      name: DATEV issuer
    - type: http
      name: POS Keycloak
    - type: http
      name: Digital Payslip
    - type: http
      name: EUDI Wallet playground
    - type: playwright
      name: datev_issuer
    - type: playwright
      name: verifier_pos_new_order
    - type: playwright
      name: verifier_pos_issuance
    - type: playwright
      name: digital_payslip_issuance
    - type: playwright
      name: digital_payslip_presentation

app-template:
  configMaps:
    http-probes:
      data:
        http_probes.yml: |
          # HTTP Probe Definitions
          # Required: name, url
          # Optional: expected_status (default 200-399), alert_severity, service,
          #           basic_auth_credentials, proxy
          #
          # Keep in sync with probes/http_probes.yml for local development.

          - name: EUDI Wallet
            url: https://wallet.eudi-adorsys.com
            service: eudi_wallet
            alert_severity: high

          - name: nginx proxy
            url: https://proxy.eudi-adorsys.com
            service: nginx_proxy
            alert_severity: high

          - name: Verifier POS demo
            url: https://registry.eudi-adorsys.com
            service: verifier_pos
            alert_severity: high

          - name: OID4VC Keycloak
            url: https://keycloak-demo.solutions.adorsys.com/realms/oid4vc-vci
            service: oid4vc_keycloak
            alert_severity: high

          - name: DATEV issuer
            url: https://adorsys-gis.github.io/keycloak-oid4vc-mock-fe-datev/
            service: datev_issuer
            alert_severity: high

          - name: POS Keycloak
            url: https://keycloak-pos.eudi-adorsys.com/realms/oid4vc-pos/.well-known/openid-configuration
            service: oid4vc_keycloak_pos
            alert_severity: high

          - name: Digital Payslip
            url: https://digitaler-gehaltsnachweis.eudi-adorsys.com
            service: digital_payslip
            alert_severity: high

          - name: EUDI Wallet playground
            url: https://playground.eudi-adorsys.com
            service: eudi_wallet_playground
            alert_severity: high

    smtp-probes:
      data:
        smtp_probes.yml: |
          # SMTP Probe Definitions
          # Required: name, host
          # Optional: alert_severity

    traceroute-probes:
      data:
        traceroute_probes.yml: |
          # Traceroute Probe Definitions
          # Required: name, host
          # Optional: alert_severity
