{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "upright.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upright.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "upright.secretStoreName" . }}
    kind: SecretStore
  target:
    name: {{ include "upright.envSecret" . }}
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.aws.secretsManagerKey | quote }}
        property: UPRIGHT_ADMIN_PASSWORD
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: {{ .Values.aws.secretsManagerKey | quote }}
        property: UPRIGHT_RAILS_MASTER_KEY
    - secretKey: PROMETHEUS_OTLP_TOKEN
      remoteRef:
        key: {{ .Values.aws.secretsManagerKey | quote }}
        property: UPRIGHT_PROMETHEUS_OTLP_TOKEN
    - secretKey: KEYCLOAK_OID4VC_USERNAME
      remoteRef:
        key: {{ .Values.aws.secretsManagerKey | quote }}
        property: UPRIGHT_KEYCLOAK_OID4VC_USERNAME
    - secretKey: KEYCLOAK_OID4VC_PASSWORD
      remoteRef:
        key: {{ .Values.aws.secretsManagerKey | quote }}
        property: UPRIGHT_KEYCLOAK_OID4VC_PASSWORD
{{- end }}
