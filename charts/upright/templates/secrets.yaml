apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "upright.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upright.labels" . | nindent 4 }}
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: {{ .Values.aws.secretStore.name }}
    kind: {{ .Values.aws.secretStore.kind }}
  target:
    name: {{ include "upright.envSecret" . }}
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.aws.secretsManagerKey }}
        property: UPRIGHT_ADMIN_PASSWORD
    - secretKey: RAILS_MASTER_KEY
      remoteRef:
        key: {{ .Values.aws.secretsManagerKey }}
        property: UPRIGHT_RAILS_MASTER_KEY
    - secretKey: PROMETHEUS_OTLP_TOKEN
      remoteRef:
        key: {{ .Values.aws.secretsManagerKey }}
        property: UPRIGHT_PROMETHEUS_OTLP_TOKEN
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: {{ .Values.aws.secretsManagerKey }}
        property: UPRIGHT_DISCORD_WEBHOOK_URL
