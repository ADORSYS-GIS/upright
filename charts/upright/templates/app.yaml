apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "upright.fullname" . }}-storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upright.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.app }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "upright.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upright.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "upright.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: metrics
      port: 9394
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "upright.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upright.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "upright.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "upright.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: db-prepare
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./bin/rails", "db:prepare"]
          env:
            {{- include "upright.appEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "upright.envSecret" . }}
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9394
          env:
            {{- include "upright.appEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "upright.envSecret" . }}
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
          startupProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
        - name: jobs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./bin/jobs"]
          env:
            {{- include "upright.appEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "upright.envSecret" . }}
          volumeMounts:
            - name: storage
              mountPath: /rails/storage
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "upright.fullname" . }}-storage
