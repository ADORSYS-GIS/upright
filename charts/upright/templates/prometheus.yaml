apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "upright.fullname" . }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upright.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["{{ include "upright.fullname" . }}-alertmanager:9093"]
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: upright
        scrape_interval: 5s
        static_configs:
          - targets: ["{{ include "upright.fullname" . }}:9394"]
  upright.rules.yml: |
{{ .Files.Get "files/upright.rules.yml" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "upright.fullname" . }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upright.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.prometheus }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "upright.fullname" . }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upright.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "upright.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "upright.fullname" . }}-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "upright.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "upright.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "upright.labels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.5.5
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.enable-remote-write-receiver
            - --web.enable-otlp-receiver
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules/upright.rules.yml
              subPath: upright.rules.yml
            - name: data
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: {{ include "upright.fullname" . }}-prometheus
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "upright.fullname" . }}-prometheus
