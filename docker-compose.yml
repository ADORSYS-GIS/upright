services:
  app:
    image: ruby:3.4-bookworm
    container_name: upright-app
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SITE_SUBDOMAIN: lon
      PORT: "3000"
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
    ports:
      - "3000:3000"
      - "9394:9394"
    volumes:
      - .:/app
      - upright-bundle:/usr/local/bundle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    # Create and migrate primary, persistent, and queue before the server listens.
    command:
      - bash
      - -c
      - export PATH="/usr/local/bundle/bin:$$PATH" && bundle install && bin/rails db:prepare && exec bin/rails server -b 0.0.0.0 -p 3000
    healthcheck:
      test: ["CMD", "ruby", "-e", "require 'socket'; TCPSocket.new('127.0.0.1', 3000).close"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      - prometheus
      - alertmanager

  jobs:
    image: ruby:3.4-bookworm
    container_name: upright-jobs
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SITE_SUBDOMAIN: lon
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
    volumes:
      - .:/app
      - upright-bundle:/usr/local/bundle
    init: true
    command:
      - bash
      - -c
      - export PATH="/usr/local/bundle/bin:$$PATH" && bundle install && exec bin/jobs
    depends_on:
      app:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: upright-prometheus
    # 9091 on the host: 9090 is already used by another local Prometheus.
    ports:
      - "127.0.0.1:9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/prometheus/development/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: upright-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config/alertmanager/development/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$DISCORD_WEBHOOK_URL" ]; then
          echo "DISCORD_WEBHOOK_URL is unset. Add it to .env so local alerts can be delivered." >&2
          exit 1
        fi
        printf '%s' "$$DISCORD_WEBHOOK_URL" > /tmp/discord_webhook
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager

volumes:
  prometheus_data:
  alertmanager_data:
  upright-bundle:
