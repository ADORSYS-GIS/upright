name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes to Docker build context
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Decides whether a push to main changes anything that can affect the image.
          #
          # The ignore list below must mirror the exclusions in .dockerignore.
          # Update both together. Do NOT list the Dockerfile, .dockerignore, or
          # .github/workflows here: they are image inputs. Anything not listed
          # triggers a build, so an omission costs an extra build, never a missed one.
          # Tags and manual dispatches always build.
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" != push ] || [ "$REF" != refs/heads/main ] || [ "$BEFORE" = "$ZERO" ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CHANGED=$(git diff --name-only "$BEFORE" HEAD -- . \
              ':!.git' ':!.gitignore' ':!.bundle' ':!.env*' ':!/log/*' ':!/tmp/*' ':!/storage/*' \
              ':!/node_modules' ':!/charts' ':!/config/deploy*.yml' ':!/.kamal' \
              ':!/.devcontainer' ':!/test' ':!/README*' ':!/docker-compose.yml' \
              ':!/Procfile.dev' ':!/docker' ':!/config/master.key' ':!/config/credentials/*.key' \
              ':!/app/assets/builds/*' ':!/public/assets'); then
            echo "Diff failed; building to be safe."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # .dockerignore re-includes these .keep files. Git exclude pathspecs
          # run last, and * matches /, so they cannot be restored in the list
          # above. Diff them on their own.
          if ! KEEP=$(git diff --name-only "$BEFORE" HEAD -- \
              log/.keep tmp/.keep tmp/pids/.keep tmp/storage/.keep \
              storage/.keep app/assets/builds/.keep); then
            echo "Diff failed; building to be safe."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$CHANGED" ] || [ -n "$KEEP" ]; then
            echo "Relevant files changed:"
            printf '%s\n' "$CHANGED" "$KEEP" | sed '/^$/d'
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only files excluded from the build context changed; skipping image build."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should-build == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/upright
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
          flavor: |
            latest=false

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            INSTALL_PLAYWRIGHT=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the image digest
        run: |
          echo "Deploy this digest:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${GITHUB_REPOSITORY,,}/upright@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
