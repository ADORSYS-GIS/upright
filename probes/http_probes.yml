# HTTP Probe Definitions
# Required: name, url
# Optional: expected_status (default 200-399), alert_severity, service,
#           basic_auth_credentials, proxy
#
# Production mounts the Helm copy from charts/upright/values-probes.yaml.
# Keep these lists in sync.

- name: EUDI Wallet
  url: https://wallet.eudi-adorsys.com
  service: eudi_wallet
  alert_severity: high

- name: nginx proxy
  url: https://proxy.eudi-adorsys.com
  service: nginx_proxy
  alert_severity: high

- name: Verifier POS demo
  url: https://registry.eudi-adorsys.com
  service: verifier_pos
  alert_severity: high

- name: OID4VC Keycloak
  url: https://keycloak-demo.solutions.adorsys.com/realms/oid4vc-vci
  service: oid4vc_keycloak
  alert_severity: high

- name: DATEV issuer
  url: https://adorsys-gis.github.io/keycloak-oid4vc-mock-fe-datev/
  service: datev_issuer
  alert_severity: high
