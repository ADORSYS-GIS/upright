# Services for the status page and the incident form.
# `code` must match the `service:` field on HTTP probes and the Playwright
# `probe_service` (set on the probe, or inherited from its authenticator's
# service name) where a browser journey owns the uptime signal.

- code: eudi_wallet
  name: EUDI Wallet
  public: true

- code: nginx_proxy
  name: nginx proxy
  public: true

- code: verifier_pos
  name: Verifier POS demo
  public: true

- code: oid4vc_keycloak
  name: OID4VC Keycloak
  public: true

- code: oid4vc_keycloak_pos
  name: POS Keycloak
  public: true

- code: digital_payslip
  name: Digital Payslip
  public: true

- code: eudi_wallet_playground
  name: EUDI Wallet playground
  public: true

- code: datev_issuer
  name: DATEV issuer
  public: true
  # Service status and uptime intentionally use HTTP only. Adding `playwright`
  # to this list is a deliberate follow-up if browser results should affect
  # uptime; first ensure Playwright metrics are continuous and agree on the
  # desired aggregation behavior.
  uptime_probe_types:
    - http
